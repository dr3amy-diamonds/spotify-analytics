version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: spotify_mongo_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: